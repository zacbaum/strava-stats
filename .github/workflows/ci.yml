name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  smoke-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Syntax check
        run: python -m py_compile app.py get_data.py build_static.py

      - name: Import smoke test (builds all figures + layout)
        run: python -c "import app; print('imported OK; current_form=', round(app.current_form, 2))"

      - name: Static build smoke test (renders docs/index.html)
        run: python build_static.py
